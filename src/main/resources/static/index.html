<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USSD Simulator</title>
    <link rel="icon" type="image/svg+xml"
          href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231a1a2e'/%3E%3Crect x='20' y='10' width='24' height='44' rx='4' fill='%232d2d2d'/%3E%3Crect x='24' y='16' width='16' height='26' rx='2' fill='%230a3d0a'/%3E%3Ctext x='32' y='34' font-family='monospace' font-size='12' fill='%2300ff00' text-anchor='middle'%3E%23%3C/text%3E%3C/svg%3E" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
        }

        .container {
            display: flex;
            gap: 40px;
            align-items: flex-start;
        }

        /* ─── PHONE ─────────────────────────────── */
        .phone {
            width: 320px;
            background: #2d2d2d;
            border-radius: 40px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .phone-speaker {
            width: 60px;
            height: 6px;
            background: #444;
            border-radius: 3px;
            margin: 0 auto 15px;
        }

        .phone-screen {
            background: #0a3d0a;
            border-radius: 8px;
            padding: 20px;
            min-height: 280px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            color: #00ff00;
            white-space: pre-wrap;
            word-wrap: break-word;
            margin-bottom: 15px;
            position: relative;
        }

        .phone-screen .status-bar {
            font-size: 11px;
            color: #aaffaa;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }

        .phone-screen .content {
            min-height: 200px;
        }

        .phone-screen .cursor {
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .phone-input-area {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .phone-input-area input {
            flex: 1;
            background: #444;
            border: 2px solid #555;
            border-radius: 8px;
            padding: 12px;
            color: #fff;
            font-size: 16px;
            font-family: 'Courier New', monospace;
            outline: none;
        }

        .phone-input-area input:focus {
            border-color: #4CAF50;
        }

        .phone-input-area button {
            background: #2e7d32;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        .phone-input-area button:hover { background: #1b5e20; }
        .phone-input-area button:active { transform: scale(0.95); }

        .phone-actions {
            display: flex;
            gap: 8px;
        }

        .phone-actions button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }

        .btn-dial {
            background: #2e7d32;
            color: white;
        }

        .btn-end {
            background: #c62828;
            color: white;
        }

        .btn-clear {
            background: #555;
            color: white;
        }

        .phone-actions button:hover { opacity: 0.9; }

        .phone-home {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #444;
            margin: 15px auto 0;
        }

        /* ─── SETTINGS PANEL ───────────────────── */
        .settings {
            background: #16213e;
            border-radius: 12px;
            padding: 25px;
            width: 300px;
        }

        .settings h2 {
            margin-bottom: 15px;
            color: #8892b0;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .settings label {
            display: block;
            color: #8892b0;
            font-size: 13px;
            margin-bottom: 5px;
        }

        .settings input {
            width: 100%;
            background: #1a1a2e;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 10px;
            color: #fff;
            font-size: 14px;
            margin-bottom: 15px;
            outline: none;
        }

        .settings input:focus { border-color: #4CAF50; }

        .session-info {
            background: #1a1a2e;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
        }

        .session-info h3 {
            color: #8892b0;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .session-info p {
            color: #ccd6f6;
            font-size: 13px;
            margin-bottom: 5px;
            font-family: monospace;
        }

        .session-info .active { color: #4CAF50; }
        .session-info .ended { color: #f44336; }

        /* ─── LOG PANEL ────────────────────────── */
        .log-panel {
            background: #16213e;
            border-radius: 12px;
            padding: 25px;
            width: 350px;
            max-height: 600px;
        }

        .log-panel h2 {
            margin-bottom: 15px;
            color: #8892b0;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .log-entries {
            max-height: 500px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
        }

        .log-entry {
            padding: 6px 0;
            border-bottom: 1px solid #1a1a2e;
            color: #8892b0;
        }

        .log-entry .dir { font-weight: bold; }
        .log-entry .dir.out { color: #4CAF50; }
        .log-entry .dir.in { color: #64b5f6; }
        .log-entry .log-time { color: #9aa5c4; }

        .log-empty {
            color: #8892b0;
            font-size: 13px;
            line-height: 1.6;
            padding: 8px 0;
            font-family: monospace;
        }

        /* ─── ACCESSIBILITY ────────────────────── */
        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
            white-space: nowrap;
            border: 0;
        }

        /* Restore a clear, consistent keyboard focus ring.
           Inputs previously set outline:none, leaving keyboard
           users with no visible focus indicator. */
        a:focus-visible,
        button:focus-visible,
        input:focus-visible {
            outline: 2px solid #4CAF50;
            outline-offset: 2px;
        }

        /* ─── RESPONSIVE ───────────────────────── */
        @media (max-width: 1080px) {
            body {
                align-items: flex-start;
                padding: 24px 16px;
            }
            .container {
                flex-direction: column;
                align-items: center;
                gap: 24px;
                width: 100%;
            }
            .settings,
            .log-panel {
                width: 100%;
                max-width: 360px;
            }
            .phone {
                width: 100%;
                max-width: 360px;
            }
            .log-panel {
                max-height: none;
            }
            .log-entries {
                max-height: 320px;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <h1 class="visually-hidden">USSD Simulator</h1>
        <!-- Settings -->
        <div class="settings">
            <h2>Phone Settings</h2>

            <label for="phoneNumber">Phone Number</label>
            <input type="text" id="phoneNumber" value="+254700000001" />

            <label for="serviceCode">Service Code</label>
            <input type="text" id="serviceCode" value="*384#" />

            <div class="session-info">
                <h3>Session</h3>
                <p>Status: <span id="sessionStatus" class="ended">Idle</span></p>
                <p>ID: <span id="sessionId">&mdash;</span></p>
                <p>Activity: <span id="lastActivity">&mdash;</span></p>
            </div>

            <div style="margin-top:20px">
                <h3 style="color:#8892b0;font-size:12px;text-transform:uppercase;margin-bottom:10px">Demo Accounts</h3>
                <p style="color:#ccd6f6;font-size:12px;font-family:monospace;margin-bottom:3px">+254700000001 PIN: 1234</p>
                <p style="color:#ccd6f6;font-size:12px;font-family:monospace;margin-bottom:3px">+254700000002 PIN: 5678</p>
                <p style="color:#ccd6f6;font-size:12px;font-family:monospace">+254700000003 PIN: 4321</p>
            </div>
        </div>

        <!-- Phone -->
        <div class="phone">
            <div class="phone-speaker"></div>
            <div class="phone-screen">
                <div class="status-bar">
                    <span>M-Wallet USSD</span>
                    <span id="clock"></span>
                </div>
                <div class="content" id="screenContent"></div>
            </div>
            <div class="phone-input-area">
                <input type="text" id="userInput" placeholder="Enter response..."
                       aria-label="USSD menu response" autocomplete="off" />
                <button onclick="sendInput()">Send</button>
            </div>
            <div class="phone-actions">
                <button class="btn-dial" onclick="dial()">Dial *384#</button>
                <button class="btn-end" onclick="endCall()">End</button>
                <button class="btn-clear" onclick="clearLog()">Clear</button>
            </div>
            <div class="phone-home"></div>
        </div>

        <!-- Log -->
        <div class="log-panel">
            <h2>Request Log</h2>
            <div class="log-empty" id="logEmpty">No requests yet.
Dial *384# to begin.</div>
            <div class="log-entries" id="logEntries"></div>
        </div>
    </main>

    <script>
        let sessionId = null;
        let sessionActive = false;

        const IDLE_MESSAGE = 'Dial *384# to start.';

        function generateSessionId() {
            return 'sess_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
        }

        function setScreen(text) {
            document.getElementById('screenContent').textContent = text;
        }

        function updateClock() {
            document.getElementById('clock').textContent =
                new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        async function dial() {
            sessionId = generateSessionId();
            sessionActive = true;

            updateSessionInfo();

            const phone = document.getElementById('phoneNumber').value;
            const code = document.getElementById('serviceCode').value;

            await sendRequest('');
        }

        async function sendInput() {
            const input = document.getElementById('userInput').value.trim();
            if (!input || !sessionActive) return;

            document.getElementById('userInput').value = '';
            await sendRequest(input);
        }

        async function sendRequest(input) {
            const phone = document.getElementById('phoneNumber').value;
            const code = document.getElementById('serviceCode').value;

            const body = {
                sessionId: sessionId,
                phoneNumber: phone,
                serviceCode: code,
                input: input
            };

            addLog('out', `Input: "${input || '(dial)'}"  Session: ${sessionId.substr(-8)}`);
            markActivity();

            try {
                const resp = await fetch('/ussd/api', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });

                const data = await resp.json();

                setScreen(data.message);
                addLog('in', data.message.replace(/\n/g, ' | '));

                if (!data.continueSession) {
                    sessionActive = false;
                    updateSessionInfo();
                    setTimeout(() => {
                        if (!sessionActive) {
                            setScreen('Session ended.\n\n' + IDLE_MESSAGE);
                        }
                    }, 3000);
                }

                updateSessionInfo();

            } catch (err) {
                setScreen('Error: ' + err.message);
                addLog('in', 'ERROR: ' + err.message);
            }
        }

        function endCall() {
            sessionActive = false;
            sessionId = null;
            setScreen('Call ended.\n\n' + IDLE_MESSAGE);
            markActivity();
            updateSessionInfo();
        }

        function markActivity() {
            document.getElementById('lastActivity').textContent =
                new Date().toLocaleTimeString('en-US',
                    { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        function updateSessionInfo() {
            const status = document.getElementById('sessionStatus');
            status.textContent = sessionActive ? 'Active' : 'Idle';
            status.className = sessionActive ? 'active' : 'ended';

            document.getElementById('sessionId').textContent =
                sessionId ? sessionId.substr(-12) : '—';
        }

        function addLog(dir, message) {
            document.getElementById('logEmpty').style.display = 'none';

            const log = document.getElementById('logEntries');
            const entry = document.createElement('div');
            entry.className = 'log-entry';

            const time = new Date().toLocaleTimeString('en-US', {
                hour: '2-digit', minute: '2-digit', second: '2-digit'
            });

            const dirSpan = document.createElement('span');
            dirSpan.className = `dir ${dir}`;
            dirSpan.textContent = dir === 'out' ? '>>>' : '<<<';

            const timeSpan = document.createElement('span');
            timeSpan.className = 'log-time';
            timeSpan.textContent = ` ${time} `;

            entry.append(dirSpan, timeSpan, document.createTextNode(message));
            log.prepend(entry);
        }

        function clearLog() {
            document.getElementById('logEntries').innerHTML = '';
            document.getElementById('logEmpty').style.display = '';
        }

        // Initialise idle state on first load
        setScreen(IDLE_MESSAGE);
        updateSessionInfo();

        // Enter key sends input
        document.getElementById('userInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendInput();
        });
    </script>
</body>
</html>
