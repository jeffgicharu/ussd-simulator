name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'   # Mondays 03:00 UTC

jobs:
  analyze:
    name: CodeQL Java
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java
          queries: security-extended

      - name: Build (no tests — CodeQL only needs the bytecode)
        run: mvn -B -DskipTests -Dspotbugs.skip=true package

      - name: CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java"
          # HIGH/CRITICAL alerts block the PR via the default
          # code-scanning check; SARIF is uploaded to the Security tab.
