name: Container & Filesystem Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'   # daily 03:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  trivy:
    name: Trivy (image + fs)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build -t ussd-simulator:scan .

      # --- Filesystem scan: secrets, IaC/misconfig, vulnerable deps in the repo ---
      - name: Trivy filesystem scan (SARIF)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-fs.sarif

      - name: Upload fs SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Trivy filesystem scan (gate)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      # --- Image scan: OS + library CVEs in the runnable artifact ---
      - name: Trivy image scan (SARIF)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: image
          image-ref: ussd-simulator:scan
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-image.sarif

      - name: Upload image SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Trivy image scan (gate)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: image
          image-ref: ussd-simulator:scan
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
